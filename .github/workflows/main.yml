name: Main Pass-Gen Workflow

on:
  push:
    branches:
      - main
      - production

jobs:
  build-and-push:
    name: Build and Push Image 
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pass-gen:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/pass-gen:latest

  deploy-prod:
    name: Deploy to Production 
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull and Deploy with Docker Compose
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
          PORT: 8000
          DATABASE_URL: "sqlite:///./passwords_prod.db"
        run: |
          echo "=================================================="
          echo "Starting deployment..."
          echo "Image tag (Git Commit SHA): $IMAGE_TAG"
          echo "Environment: Production"
          echo "Docker Username: $DOCKERHUB_USERNAME"
          echo "=================================================="
          docker compose -f docker-compose.production.yml pull app
          docker compose -f docker-compose.production.yml up -d
          echo "Logs - release:"
          docker compose -f docker-compose.production.yml logs app
