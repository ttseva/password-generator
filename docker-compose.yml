services:
  db:
    image: postgres:16-alpine
    container_name: password-generator-db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: password_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: password-generator-redis
    restart: always

  migrate:
    build: .
    command: python -m app.cli migrate
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/password_db
    depends_on:
      - db
    profiles:
      - tools

  create-admin:
    build: .
    command: python -m app.cli create-admin
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/password_db
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
    depends_on:
      - db
    profiles:
      - tools

  clear-cache:
    build: .
    command: python -m app.cli clear-cache
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    profiles:
      - tools

  app:
    build: .
    command: python -m app.cli server
    ports:
      - "8001-8003:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://user:password@db:5432/password_db
      - REDIS_URL=redis://redis:6379/0
      - DEFAULT_LENGTH=16
      - INCLUDE_DIGITS=true
      - INCLUDE_SPECIALS=true
    depends_on:
      - db
      - redis
    volumes:
      - .:/app
    deploy:
      replicas: 3

  nginx:
    image: nginx:alpine
    container_name: password-generator-lb
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app

volumes:
  postgres_data:
