services:
  db:
    image: postgres:16
    container_name: password-generator-db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: password_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: password-generator-redis
    restart: always

  app:
    build: .
    ports:
      - "8001-8003:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://user:password@db:5432/password_db
      - REDIS_URL=redis://redis:6379/0
      - DEFAULT_LENGTH=16
      - INCLUDE_DIGITS=true
      - INCLUDE_SPECIALS=true
    depends_on:
      - db
      - redis
    volumes:
      - .:/app
    deploy:
      replicas: 3

  nginx:
    image: nginx:alpine
    container_name: password-generator-lb
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app

volumes:
  postgres_data:
