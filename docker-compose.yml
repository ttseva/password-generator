version: "3.9"

services:
  app:
    build: .
    container_name: password-generator
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    environment:
      - PORT=${PORT:-8000}
      - HOST=0.0.0.0
      - DATABASE_URL=sqlite:///./passwords.db
      - DEFAULT_LENGTH=16
      - INCLUDE_DIGITS=true
      - INCLUDE_SPECIALS=true
    volumes:
      - .:/app